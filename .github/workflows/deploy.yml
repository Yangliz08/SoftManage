name: CI/CD — build, push images and deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Docker images, push to registry and deploy to server
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend images
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-task:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-workflow:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-report:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-notification:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-audit:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-ai:latest
        build: |
          [
            {"context":"./sm-project/sm-gateway","dockerfile":"Dockerfile","target":null},
            {"context":"./sm-project/sm-auth","dockerfile":"Dockerfile","target":null},
            {"context":"./sm-project/sm-task","dockerfile":"Dockerfile","target":null},
            {"context":"./sm-project/sm-workflow","dockerfile":"Dockerfile","target":null},
            {"context":"./sm-project/sm-report","dockerfile":"Dockerfile","target":null},
            {"context":"./sm-project/sm-notification","dockerfile":"Dockerfile","target":null},
            {"context":"./sm-project/sm-audit","dockerfile":"Dockerfile","target":null},
            {"context":"./sm-project/sm-ai","dockerfile":"Dockerfile","target":null}
          ]

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./sm-project-vue
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/softmanage-frontend:latest

      - name: Deploy to remote server by SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -e
            cd ~/softmanage-deploy || mkdir -p ~/softmanage-deploy && cd ~/softmanage-deploy
            # pull latest docker-compose that references images from Docker Hub
            # you should create a docker-compose.prod.yml on the server beforehand
            if [ -f docker-compose.prod.yml ]; then
              docker-compose -f docker-compose.prod.yml pull
              docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            else
              echo 'docker-compose.prod.yml not found on server. Please create it referencing your DockerHub images.'
              exit 1
            fi

      - name: Notify
        run: echo "Deployed to ${{ secrets.DEPLOY_HOST }}"

